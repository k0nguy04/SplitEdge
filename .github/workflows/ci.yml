name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Ephemeral, runner-local service container that exists only for this job.
        # Not the primary or local dev database/user; no repository secret needed.
        env:
          POSTGRES_DB: splitedge_backend_test
          POSTGRES_USER: splitedge_ci
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitedge_ci -d splitedge_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Matches IntegrationDatabaseSettings.fromEnvironment()'s Spring-standard branch.
      # No Flyway Maven goal is needed here: GuardedPostgres applies V1-V3 itself
      # before the guarded IT classes run.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/splitedge_backend_test
      SPRING_DATASOURCE_USERNAME: splitedge_ci
      SPRING_DATASOURCE_PASSWORD: ci_ephemeral_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend (unit + guarded PostgreSQL integration)
        working-directory: backend
        run: mvn --batch-mode -Ppostgres-it verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  importer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Ephemeral, runner-local service container that exists only for this job.
        # Not the primary or local dev password; no repository secret needed.
        env:
          POSTGRES_DB: splitedge_test
          POSTGRES_USER: splitedge
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitedge -d splitedge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://splitedge:ci_ephemeral_password@localhost:5432/splitedge_test
      NBA_SEASON: "2025-26"
      NBA_IMPORT_SEASONS: "2023-24,2024-25,2025-26"
      FLYWAY_URL: jdbc:postgresql://localhost:5432/splitedge_test
      POSTGRES_USER: splitedge
      POSTGRES_PASSWORD: ci_ephemeral_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: importer/pyproject.toml
      - name: Install importer
        working-directory: importer
        run: python -m pip install -e ".[dev]"
      - name: Lint importer
        working-directory: importer
        run: python -m ruff check .
      - name: Apply Flyway migrations
        working-directory: backend
        run: >
          mvn --batch-mode flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/splitedge_test
          -Dflyway.user=splitedge
          -Dflyway.password=ci_ephemeral_password
      - name: Test importer
        working-directory: importer
        env:
          IMPORT_MIN_TEAMS: "1"
          IMPORT_MIN_ACTIVE_PLAYERS: "1"
          IMPORT_MIN_GAMES_PER_SEASON: "1"
          IMPORT_MIN_PLAYER_STATS_PER_SEASON: "1"
        run: python -m pytest
