services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splitedge}
      POSTGRES_USER: ${POSTGRES_USER:-splitedge}
      # Required, not defaulted: copy .env.example to .env and set your own
      # local-only value first. Never commit a real password here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file (copy .env.example first); never commit a real value}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - splitedge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitedge} -d ${POSTGRES_DB:-splitedge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitedge-postgres-data:
